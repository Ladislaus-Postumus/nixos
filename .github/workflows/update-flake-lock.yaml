name: Update flake.lock

on:
  schedule:
    - cron: '0 3 * * 1' # Every Monday at 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Create flake.lock update PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          nix flake update

          if git diff --quiet flake.lock; then
            echo "no input updates. already up to date"
            exit 0
          fi

          git checkout -b flake-lock-update
          git commit -am "flake.lock: update inputs"
          git push origin flake-lock-update --force
          gh pr create \
            --title "flake.lock update: $(date +'%Y-%m-%d')" \
            --body "Automated \`nix flake update\`." \
            --base main \
            --head flake-lock-update
